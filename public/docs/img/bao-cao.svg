<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" role="img" aria-label="Minh họa trang báo cáo và xuất Excel">
  <rect width="720" height="260" rx="16" fill="#f6f6f4"/>
  <g font-family="Inter, 'Segoe UI', Arial, sans-serif">
    <!-- khung dashboard -->
    <rect x="40" y="24" width="640" height="196" rx="14" fill="#ffffff" stroke="#e7e3da"/>
    <!-- thanh lọc -->
    <rect x="60" y="42" width="120" height="26" rx="8" fill="#f6f6f4" stroke="#d9d5cc"/>
    <text x="70" y="59" font-size="10" fill="#66655f">Từ ngày</text>
    <rect x="190" y="42" width="120" height="26" rx="8" fill="#f6f6f4" stroke="#d9d5cc"/>
    <text x="200" y="59" font-size="10" fill="#66655f">Đến ngày</text>
    <rect x="320" y="42" width="140" height="26" rx="8" fill="#f6f6f4" stroke="#d9d5cc"/>
    <text x="330" y="59" font-size="10" fill="#66655f">Phòng ban</text>
    <rect x="560" y="42" width="100" height="26" rx="8" fill="#059669"/>
    <text x="610" y="59" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="700">Excel ⬇</text>
    <!-- thẻ KPI -->
    <g>
      <rect x="60" y="82" width="140" height="58" rx="10" fill="#eef4ff" stroke="#c7d7fe"/>
      <text x="72" y="104" font-size="10" fill="#3b5bd6">Tổng đơn duyệt</text>
      <text x="72" y="128" font-size="20" font-weight="800" fill="#1d4ed8">67</text>
      <rect x="212" y="82" width="140" height="58" rx="10" fill="#ecfdf5" stroke="#a7f3d0"/>
      <text x="224" y="104" font-size="10" fill="#047857">Tháng này</text>
      <text x="224" y="128" font-size="20" font-weight="800" fill="#059669">37 ▲23%</text>
      <rect x="364" y="82" width="140" height="58" rx="10" fill="#fff7ed" stroke="#fed7aa"/>
      <text x="376" y="104" font-size="10" fill="#b45309">Phòng dẫn đầu</text>
      <text x="376" y="126" font-size="13" font-weight="800" fill="#92400e">Kinh doanh</text>
    </g>
    <!-- biểu đồ cột -->
    <g>
      <rect x="60" y="152" width="300" height="52" rx="8" fill="#fafaf8" stroke="#eeece7"/>
      <rect x="72" y="164" width="150" height="10" rx="5" fill="#3b82f6"/>
      <rect x="72" y="180" width="90" height="10" rx="5" fill="#10b981"/>
      <rect x="72" y="196" width="40" height="8" rx="4" fill="#f59e0b"/>
      <text x="232" y="172" font-size="9" fill="#66655f">27</text>
      <text x="170" y="188" font-size="9" fill="#66655f">20</text>
    </g>
    <!-- donut -->
    <g>
      <circle cx="470" cy="178" r="26" fill="none" stroke="#e5e7eb" stroke-width="12"/>
      <circle cx="470" cy="178" r="26" fill="none" stroke="#3b82f6" stroke-width="12" stroke-dasharray="140 163" transform="rotate(-90 470 178)"/>
      <circle cx="470" cy="178" r="26" fill="none" stroke="#10b981" stroke-width="12" stroke-dasharray="14 163" transform="rotate(160 470 178)"/>
      <text x="470" y="182" font-size="12" font-weight="800" fill="#111315" text-anchor="middle">98</text>
      <rect x="520" y="158" width="10" height="10" rx="3" fill="#3b82f6"/><text x="536" y="167" font-size="9" fill="#66655f">Kinh doanh 86%</text>
      <rect x="520" y="176" width="10" height="10" rx="3" fill="#10b981"/><text x="536" y="185" font-size="9" fill="#66655f">Kỹ thuật 6%</text>
    </g>
    <text x="360" y="246" font-size="12" fill="#66655f" text-anchor="middle">Báo cáo: bộ lọc ở trên, thẻ số liệu, biểu đồ phân bổ và nút xuất Excel cho từng bảng</text>
  </g>
</svg>
