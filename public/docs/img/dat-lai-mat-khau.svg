<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 262" role="img" aria-label="Ba bước đặt lại mật khẩu cho nhân viên quên mật khẩu">
  <rect width="720" height="262" rx="16" fill="#f6f6f4"/>
  <g font-family="Inter, 'Segoe UI', Arial, sans-serif">
    <!-- Bước 1 -->
    <g>
      <rect x="30" y="44" width="200" height="176" rx="14" fill="#ffffff" stroke="#e7e3da"/>
      <circle cx="58" cy="74" r="16" fill="#4f46e5"/>
      <text x="58" y="80" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700">1</text>
      <text x="84" y="70" font-size="12.5" font-weight="700" fill="#111315">Mở hồ sơ nhân viên</text>
      <text x="84" y="86" font-size="10" fill="#66655f">Nhân sự → bấm vào tên họ</text>
      <rect x="46" y="102" width="168" height="28" rx="8" fill="#f6f6f4" stroke="#d9d5cc"/>
      <text x="56" y="121" font-size="9.5" fill="#8c8a83">Tìm theo tên hoặc mã nhân sự</text>
      <rect x="46" y="138" width="168" height="30" rx="8" fill="#eceafe" stroke="#c7c2f5"/>
      <text x="56" y="157" font-size="9.5" fill="#4338ca">Nút "Đặt lại mật khẩu"</text>
      <text x="46" y="186" font-size="9.5" fill="#66655f">Chỉ hiện khi người đó còn hoạt động.</text>
      <text x="46" y="202" font-size="9.5" fill="#66655f">Tài khoản đã khóa thì phải mở khóa trước.</text>
    </g>

    <!-- Bước 2 -->
    <g>
      <rect x="260" y="44" width="200" height="176" rx="14" fill="#ffffff" stroke="#e7e3da"/>
      <circle cx="288" cy="74" r="16" fill="#d97706"/>
      <text x="288" y="80" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700">2</text>
      <text x="314" y="70" font-size="9" font-weight="700" fill="#111315">Hệ thống sinh mật khẩu tạm</text>
      <text x="314" y="86" font-size="10" fill="#66655f">Bạn không tự đặt mật khẩu</text>
      <rect x="276" y="102" width="168" height="46" rx="9" fill="#fff7e6" stroke="#f0d9a8"/>
      <text x="286" y="120" font-size="9.5" fill="#8a5a00">Mật khẩu tạm hiện trên màn hình</text>
      <text x="286" y="136" font-size="9.5" fill="#8a5a00">để bạn đọc lại cho nhân viên.</text>
      <rect x="276" y="156" width="168" height="52" rx="9" fill="#e7f5fd" stroke="#b6e0f5"/>
      <text x="286" y="174" font-size="9.5" font-weight="600" fill="#0c4a6e">Đồng thời gửi vào Telegram</text>
      <text x="286" y="190" font-size="9.5" fill="#0c4a6e">của nhân viên — nếu họ đã kết nối.</text>
      <text x="286" y="204" font-size="8" fill="#66655f">Chưa kết nối thì chỉ có cách đọc trực tiếp.</text>
    </g>

    <!-- Bước 3 -->
    <g>
      <rect x="490" y="44" width="200" height="176" rx="14" fill="#ffffff" stroke="#e7e3da"/>
      <circle cx="518" cy="74" r="16" fill="#16a34a"/>
      <text x="518" y="80" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700">3</text>
      <text x="544" y="70" font-size="9" font-weight="700" fill="#111315">Nhân viên đăng nhập lại</text>
      <text x="544" y="86" font-size="10" fill="#66655f">Bị bắt buộc đổi ngay</text>
      <rect x="506" y="102" width="168" height="30" rx="9" fill="#f6f6f4" stroke="#d9d5cc"/>
      <text x="516" y="121" font-size="9.5" fill="#3f3e3a">Email làm việc + mật khẩu tạm</text>
      <rect x="506" y="138" width="168" height="50" rx="9" fill="#e6f5f3" stroke="#a7ded6"/>
      <text x="516" y="156" font-size="9.5" fill="#0f766e">Màn "Đổi mật khẩu bắt buộc" mở ra</text>
      <text x="516" y="172" font-size="9.5" fill="#0f766e">Không thể bỏ qua bước này —</text>
      <text x="516" y="184" font-size="9.5" fill="#0f766e">không vào được menu nào.</text>
      <text x="506" y="208" font-size="9.5" fill="#66655f">Sau đó mật khẩu tạm hết hiệu lực.</text>
    </g>

    <path d="M236 132 h18 m0 0 l-6 -5 m6 5 l-6 5" stroke="#9a968d" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M466 132 h18 m0 0 l-6 -5 m6 5 l-6 5" stroke="#9a968d" stroke-width="2" fill="none" stroke-linecap="round"/>

    <text x="360" y="240" font-size="12" fill="#66655f" text-anchor="middle">Quên mật khẩu không tự đổi được — luôn phải qua Nhân sự để bảo đảm danh tính</text>
  </g>
</svg>
