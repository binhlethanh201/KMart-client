<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-label="Ba thao tác của người duyệt: duyệt, từ chối và yêu cầu bổ sung">
  <rect width="720" height="300" rx="16" fill="#f6f6f4"/>
  <g font-family="Inter, 'Segoe UI', Arial, sans-serif">
    <!-- Duyệt -->
    <g>
      <rect x="30" y="44" width="200" height="200" rx="14" fill="#ffffff" stroke="#e7e3da"/>
      <circle cx="58" cy="74" r="16" fill="#16a34a"/>
      <text x="84" y="70" font-size="12.5" font-weight="700" fill="#111315">Approve request</text>
      <text x="84" y="86" font-size="10" fill="#66655f">The green button</text>
      <rect x="46" y="102" width="168" height="30" rx="9" fill="#e6f5f3" stroke="#a7ded6"/>
      <text x="57" y="121" font-size="9.5" fill="#0f766e">Next step: moves immediately</text>
      <rect x="46" y="140" width="168" height="30" rx="9" fill="#e6f5f3" stroke="#a7ded6"/>
      <text x="57" y="159" font-size="9.5" fill="#0f766e">Last step: Approved</text>
      <rect x="46" y="178" width="168" height="52" rx="9" fill="#f6f6f4" stroke="#d9d5cc"/>
      <text x="56" y="196" font-size="9.5" fill="#66655f" textLength="152.0" lengthAdjust="spacingAndGlyphs">The next approver and the requester</text>
      <text x="56" y="212" font-size="9.5" fill="#66655f">are both notified.</text>
      <text x="56" y="226" font-size="9.5" fill="#66655f">Nothing else needs to be written.</text>
    </g>

    <!-- Từ chối -->
    <g>
      <rect x="260" y="44" width="200" height="200" rx="14" fill="#ffffff" stroke="#e7e3da"/>
      <circle cx="288" cy="74" r="16" fill="#dc2626"/>
      <text x="314" y="70" font-size="12.5" font-weight="700" fill="#111315">Reject</text>
      <text x="314" y="86" font-size="10" fill="#66655f" textLength="140.0" lengthAdjust="spacingAndGlyphs">The request stops here for good</text>
      <rect x="276" y="102" width="168" height="30" rx="9" fill="#feecec" stroke="#fbd5d5"/>
      <text x="286" y="121" font-size="9.5" fill="#b91c1c" font-weight="600">Reason is mandatory</text>
      <rect x="276" y="140" width="168" height="52" rx="9" fill="#f6f6f4" stroke="#d9d5cc"/>
      <text x="286" y="158" font-size="9.5" fill="#66655f">The "Rejection reason" dialog</text>
      <text x="286" y="174" font-size="8.5" fill="#66655f" textLength="152.0" lengthAdjust="spacingAndGlyphs">blocks submitting while the box is empty.</text>
      <text x="286" y="188" font-size="9.5" fill="#66655f">Up to 1000 characters.</text>
      <rect x="276" y="200" width="168" height="30" rx="9" fill="#feecec" stroke="#fbd5d5"/>
      <text x="286" y="219" font-size="9.5" fill="#b91c1c">The requester receives this reason</text>
    </g>

    <!-- Yêu cầu bổ sung -->
    <g>
      <rect x="490" y="44" width="200" height="200" rx="14" fill="#ffffff" stroke="#e7e3da"/>
      <circle cx="518" cy="74" r="16" fill="#a855f7"/>
      <text x="544" y="70" font-size="12.5" font-weight="700" fill="#111315">Supplement requested</text>
      <text x="544" y="86" font-size="9" fill="#66655f" textLength="140.0" lengthAdjust="spacingAndGlyphs">The request returns to the requester</text>
      <rect x="506" y="102" width="168" height="30" rx="9" fill="#f4eefe" stroke="#ddd0fb"/>
      <text x="516" y="121" font-size="9.5" fill="#6d28d9" font-weight="600">Must state exactly what is needed</text>
      <rect x="506" y="140" width="168" height="52" rx="9" fill="#f6f6f4" stroke="#d9d5cc"/>
      <text x="516" y="158" font-size="9.5" fill="#66655f">The request moves to</text>
      <text x="516" y="174" font-size="8.5" fill="#66655f">"Supplement requested" and still keeps</text>
      <text x="516" y="188" font-size="9.5" fill="#66655f">the step it was on.</text>
      <rect x="506" y="200" width="168" height="30" rx="9" fill="#f4eefe" stroke="#ddd0fb"/>
      <text x="516" y="219" font-size="8.5" fill="#6d28d9">Approval continues after they resubmit</text>
    </g>

    <text x="360" y="270" font-size="12" fill="#66655f" text-anchor="middle">Only 3 actions. There is no "forward to another level" and no "edit the request for the requester"</text>
  </g>
</svg>
