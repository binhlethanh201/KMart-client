<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 262" role="img" aria-label="Ba bước đặt lại mật khẩu cho nhân viên quên mật khẩu">
  <rect width="720" height="262" rx="16" fill="#f6f6f4"/>
  <g font-family="Inter, 'Segoe UI', Arial, sans-serif">
    <!-- Bước 1 -->
    <g>
      <rect x="30" y="44" width="200" height="176" rx="14" fill="#ffffff" stroke="#e7e3da"/>
      <circle cx="58" cy="74" r="16" fill="#4f46e5"/>
      <text x="58" y="80" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700">1</text>
      <text x="84" y="70" font-size="12.5" font-weight="700" fill="#111315">직원 프로필 열기</text>
      <text x="84" y="86" font-size="10" fill="#66655f">인사 → 이름을 클릭</text>
      <rect x="46" y="102" width="168" height="28" rx="8" fill="#f6f6f4" stroke="#d9d5cc"/>
      <text x="56" y="121" font-size="9.5" fill="#8c8a83">이름 또는 사번으로 검색</text>
      <rect x="46" y="138" width="168" height="30" rx="8" fill="#eceafe" stroke="#c7c2f5"/>
      <text x="56" y="157" font-size="9.5" fill="#4338ca">"비밀번호 재설정" 버튼</text>
      <text x="46" y="186" font-size="9.5" fill="#66655f">해당 직원이 재직 중일 때만 표시됩니다.</text>
      <text x="46" y="202" font-size="9.5" fill="#66655f">잠긴 계정은 먼저 잠금을 해제해야 합니다.</text>
    </g>

    <!-- Bước 2 -->
    <g>
      <rect x="260" y="44" width="200" height="176" rx="14" fill="#ffffff" stroke="#e7e3da"/>
      <circle cx="288" cy="74" r="16" fill="#d97706"/>
      <text x="288" y="80" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700">2</text>
      <text x="314" y="70" font-size="8" font-weight="700" fill="#111315">시스템이 임시 비밀번호를 생성합니다</text>
      <text x="314" y="86" font-size="10" fill="#66655f" textLength="140.0" lengthAdjust="spacingAndGlyphs">비밀번호는 직접 정하지 않습니다</text>
      <rect x="276" y="102" width="168" height="46" rx="9" fill="#fff7e6" stroke="#f0d9a8"/>
      <text x="286" y="120" font-size="9.5" fill="#8a5a00">임시 비밀번호가 화면에 표시됩니다</text>
      <text x="286" y="136" font-size="8.5" fill="#8a5a00">직원에게 읽어줄 수 있도록 표시됩니다.</text>
      <rect x="276" y="156" width="168" height="52" rx="9" fill="#e7f5fd" stroke="#b6e0f5"/>
      <text x="286" y="174" font-size="9.5" font-weight="600" fill="#0c4a6e">동시에 텔레그램으로도 발송</text>
      <text x="286" y="190" font-size="8.5" fill="#0c4a6e" textLength="152.0" lengthAdjust="spacingAndGlyphs">직원의 텔레그램으로 — 연결한 경우에만.</text>
      <text x="286" y="204" font-size="8" fill="#66655f" textLength="152.0" lengthAdjust="spacingAndGlyphs">연결하지 않았다면 직접 읽어주는 방법뿐입니다.</text>
    </g>

    <!-- Bước 3 -->
    <g>
      <rect x="490" y="44" width="200" height="176" rx="14" fill="#ffffff" stroke="#e7e3da"/>
      <circle cx="518" cy="74" r="16" fill="#16a34a"/>
      <text x="518" y="80" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700">3</text>
      <text x="544" y="70" font-size="9" font-weight="700" fill="#111315">직원이 다시 로그인</text>
      <text x="544" y="86" font-size="10" fill="#66655f">즉시 변경 강제</text>
      <rect x="506" y="102" width="168" height="30" rx="9" fill="#f6f6f4" stroke="#d9d5cc"/>
      <text x="516" y="121" font-size="9.5" fill="#3f3e3a">업무 이메일 + 임시 비밀번호</text>
      <rect x="506" y="138" width="168" height="50" rx="9" fill="#e6f5f3" stroke="#a7ded6"/>
      <text x="516" y="156" font-size="9.5" fill="#0f766e" textLength="152.0" lengthAdjust="spacingAndGlyphs">"비밀번호 변경 필수" 화면이 열립니다</text>
      <text x="516" y="172" font-size="9.5" fill="#0f766e">이 단계는 건너뛸 수 없습니다 —</text>
      <text x="516" y="184" font-size="9.5" fill="#0f766e">어떤 메뉴도 들어갈 수 없습니다.</text>
      <text x="506" y="208" font-size="9.5" fill="#66655f">이후 임시 비밀번호는 무효가 됩니다.</text>
    </g>

    <path d="M236 132 h18 m0 0 l-6 -5 m6 5 l-6 5" stroke="#9a968d" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M466 132 h18 m0 0 l-6 -5 m6 5 l-6 5" stroke="#9a968d" stroke-width="2" fill="none" stroke-linecap="round"/>

    <text x="360" y="240" font-size="12" fill="#66655f" text-anchor="middle">비밀번호는 스스로 재설정할 수 없습니다 — 신원 확인을 위해 항상 인사를 거쳐야 합니다</text>
  </g>
</svg>
