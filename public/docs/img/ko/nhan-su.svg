<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 262" role="img" aria-label="Ba bước làm việc trên màn Nhân sự: tìm và lọc, mở hồ sơ chi tiết, khóa tài khoản khi nhân viên nghỉ việc">
  <rect width="720" height="262" rx="16" fill="#f6f6f4"/>
  <g font-family="Inter, 'Segoe UI', Arial, sans-serif">
    <!-- Bước 1 -->
    <g>
      <rect x="30" y="44" width="200" height="176" rx="14" fill="#ffffff" stroke="#e7e3da"/>
      <circle cx="58" cy="74" r="16" fill="#4f46e5"/>
      <text x="58" y="80" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700">1</text>
      <text x="84" y="70" font-size="12.5" font-weight="700" fill="#111315">직원 검색 &amp; 필터</text>
      <text x="84" y="86" font-size="10" fill="#66655f">인사 메뉴</text>
      <rect x="46" y="100" width="168" height="28" rx="8" fill="#f6f6f4" stroke="#d9d5cc"/>
      <text x="56" y="119" font-size="9.5" fill="#8c8a83">이름, 사번, 이메일로 검색…</text>
      <rect x="46" y="136" width="80" height="26" rx="8" fill="#f6f6f4" stroke="#d9d5cc"/>
      <text x="86" y="153" font-size="9.5" fill="#3f3e3a" text-anchor="middle">부서</text>
      <rect x="134" y="136" width="80" height="26" rx="8" fill="#f6f6f4" stroke="#d9d5cc"/>
      <text x="174" y="153" font-size="9.5" fill="#3f3e3a" text-anchor="middle">상태</text>
      <text x="46" y="184" font-size="9.5" fill="#66655f">휴대폰에서는 필터가 자동으로 접히며,</text>
      <text x="46" y="198" font-size="9.5" fill="#66655f">"필터" 행을 눌러 펼칩니다.</text>
    </g>

    <!-- Bước 2 -->
    <g>
      <rect x="260" y="44" width="200" height="176" rx="14" fill="#ffffff" stroke="#e7e3da"/>
      <circle cx="288" cy="74" r="16" fill="#4f46e5"/>
      <text x="288" y="80" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700">2</text>
      <text x="314" y="70" font-size="12.5" font-weight="700" fill="#111315">상세 프로필 열기</text>
      <text x="314" y="86" font-size="10" fill="#66655f">직원 한 명을 클릭</text>
      <rect x="276" y="100" width="168" height="104" rx="9" fill="#f6f6f4" stroke="#e7e3da"/>
      <text x="286" y="118" font-size="9.5" fill="#3f3e3a">연락처 정보</text>
      <text x="286" y="136" font-size="9.5" fill="#3f3e3a">부서 – 주 직위</text>
      <text x="286" y="154" font-size="9.5" fill="#3f3e3a">겸직 직위</text>
      <text x="286" y="172" font-size="9.5" fill="#3f3e3a">시스템 역할</text>
      <text x="286" y="190" font-size="9.5" fill="#66655f">기간별 직위 이력</text>
    </g>

    <!-- Bước 3 -->
    <g>
      <rect x="490" y="44" width="200" height="176" rx="14" fill="#ffffff" stroke="#e7e3da"/>
      <circle cx="518" cy="74" r="16" fill="#d97706"/>
      <text x="518" y="80" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700">3</text>
      <text x="544" y="70" font-size="12.5" font-weight="700" fill="#111315">직원이 퇴사한 경우</text>
      <text x="544" y="86" font-size="8.5" fill="#66655f">계정 잠금 (삭제 아님)</text>
      <rect x="506" y="100" width="168" height="34" rx="9" fill="#fff7e6" stroke="#f0d9a8"/>
      <text x="516" y="118" font-size="9.5" font-weight="600" fill="#8a5a00">"계정 잠금" 클릭</text>
      <text x="516" y="130" font-size="9" fill="#8a5a00">버튼에 표시: 잠김 / 잠금 해제</text>
      <rect x="506" y="142" width="168" height="62" rx="9" fill="#f6f6f4" stroke="#d9d5cc"/>
      <text x="516" y="160" font-size="8" fill="#3f3e3a">상태가 "비활성"으로 변경됩니다</text>
      <text x="516" y="176" font-size="9.5" fill="#3f3e3a">계정은 로그인이 차단되지만</text>
      <text x="516" y="190" font-size="8" fill="#3f3e3a" textLength="152.0" lengthAdjust="spacingAndGlyphs">기존 요청서와 결재 이력은 그대로 유지됩니다.</text>
    </g>

    <path d="M236 132 h18 m0 0 l-6 -5 m6 5 l-6 5" stroke="#9a968d" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M466 132 h18 m0 0 l-6 -5 m6 5 l-6 5" stroke="#9a968d" stroke-width="2" fill="none" stroke-linecap="round"/>

    <text x="360" y="240" font-size="12" fill="#66655f" text-anchor="middle">"직원 삭제" 기능은 없습니다 — 잠금만 가능하며 과거 결재 데이터는 보존됩니다</text>
  </g>
</svg>
