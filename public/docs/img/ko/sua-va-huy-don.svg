<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" role="img" aria-label="Hai luồng: bổ sung hồ sơ theo yêu cầu và hủy đơn khi chưa ai duyệt">
  <rect width="720" height="470" rx="16" fill="#f6f6f4"/>
  <g font-family="Inter, 'Segoe UI', Arial, sans-serif">
    <text x="30" y="30" font-size="13" font-weight="700" fill="#7c3aed">A · 결재자가 요청하면 서류 보완</text>
    <g>
      <rect x="30" y="42" width="200" height="150" rx="14" fill="#ffffff" stroke="#e7e3da"/>
      <circle cx="56" cy="70" r="14" fill="#7c3aed"/>
      <text x="56" y="75" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700">1</text>
      <text x="80" y="66" font-size="11.5" font-weight="700" fill="#111315">보완 요청 수신</text>
      <text x="80" y="80" font-size="9.5" fill="#66655f">목록 또는 텔레그램에서</text>
      <rect x="46" y="94" width="168" height="22" rx="7" fill="#f4eefe" stroke="#ddd0fb"/>
      <circle cx="59" cy="105" r="4" fill="#a855f7"/>
      <text x="70" y="109" font-size="8.5" fill="#5b21b6">보완 요청 — REQ-000123</text>
      <rect x="46" y="124" width="168" height="22" rx="7" fill="#ffffff" stroke="#e7e3da"/>
      <text x="57" y="139" font-size="10" fill="#3f3e3a">의사 진단서가 누락됨</text>
      <text x="46" y="166" font-size="8.5" fill="#66655f">요청서는 진행 중이던 단계에 그대로 남습니다.</text>
      <text x="46" y="180" font-size="8" fill="#66655f">본인만 알림을 받고 다른 사람은 받지 않습니다.</text>
    </g>

    <g>
      <rect x="260" y="42" width="200" height="150" rx="14" fill="#ffffff" stroke="#e7e3da"/>
      <circle cx="286" cy="70" r="14" fill="#7c3aed"/>
      <text x="286" y="75" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700">2</text>
      <text x="310" y="66" font-size="11.5" font-weight="700" fill="#111315">요청서 열기 → 보완 클릭</text>
      <text x="310" y="80" font-size="9.5" fill="#66655f">"요청서 보완" 대화상자</text>
      <rect x="276" y="94" width="168" height="22" rx="7" fill="#eef4ff" stroke="#c7d7fe"/>
      <text x="287" y="109" font-size="10" fill="#3b5bd6">누락된 항목을 입력</text>
      <rect x="276" y="124" width="168" height="22" rx="7" fill="#eef4ff" stroke="#c7d7fe"/>
      <text x="287" y="139" font-size="10" fill="#3b5bd6">첨부 파일 추가 / 변경</text>
      <text x="276" y="166" font-size="9.5" fill="#66655f" textLength="178.0" lengthAdjust="spacingAndGlyphs">필수 입력란에는 * 가 붙습니다 — 누락되면</text>
      <text x="276" y="180" font-size="9.5" fill="#66655f">양식이 바로 막고 알려줍니다.</text>
    </g>

    <g>
      <rect x="490" y="42" width="200" height="150" rx="14" fill="#ffffff" stroke="#e7e3da"/>
      <circle cx="516" cy="70" r="14" fill="#16a34a"/>
      <text x="516" y="75" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700">3</text>
      <text x="540" y="66" font-size="11.5" font-weight="700" fill="#111315">재상신</text>
      <text x="540" y="80" font-size="9.5" fill="#66655f">"보완 &amp; 재상신" 버튼</text>
      <rect x="506" y="94" width="168" height="44" rx="9" fill="#fef3c7" stroke="#f0d9a8"/>
      <text x="518" y="113" font-size="10" font-weight="700" fill="#8a5a00">요청서가 "대기"로 돌아갑니다</text>
      <text x="518" y="128" font-size="9.5" fill="#8a5a00">진행 중이던 바로 그 단계로</text>
      <text x="506" y="166" font-size="9.5" fill="#66655f">해당 단계의 결재자가 알림을 받습니다</text>
      <text x="506" y="180" font-size="9.5" fill="#66655f">다시 처리하러 돌아오기 위해서입니다.</text>
    </g>

    <path d="M236 116 h18 m0 0 l-6 -5 m6 5 l-6 5" stroke="#9a968d" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M466 116 h18 m0 0 l-6 -5 m6 5 l-6 5" stroke="#9a968d" stroke-width="2" fill="none" stroke-linecap="round"/>

    <line x1="30" y1="222" x2="690" y2="222" stroke="#e7e3da" stroke-width="1.5"/>

    <text x="30" y="258" font-size="13" font-weight="700" fill="#dc2626">B · 본인 요청서 취소 (아무도 결재하지 않았을 때만)</text>
    <g>
      <rect x="30" y="270" width="200" height="150" rx="14" fill="#ffffff" stroke="#e7e3da"/>
      <circle cx="56" cy="298" r="14" fill="#16a34a"/>
      <text x="56" y="303" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700">1</text>
      <text x="80" y="294" font-size="11.5" font-weight="700" fill="#111315">조건 확인</text>
      <text x="80" y="308" font-size="8.5" fill="#66655f" textLength="144.0" lengthAdjust="spacingAndGlyphs">"요청서 취소" 버튼은 다음일 때만 표시됩니다…</text>
      <rect x="46" y="322" width="168" height="86" rx="9" fill="#e6f5f3" stroke="#a7ded6"/>
      <text x="57" y="340" font-size="9" fill="#0f766e" textLength="151.0" lengthAdjust="spacingAndGlyphs">✓ 아무도 어떤 단계도 결재하지 않았습니다</text>
      <text x="57" y="358" font-size="9" fill="#0f766e" textLength="151.0" lengthAdjust="spacingAndGlyphs">✓ 요청서가 대기 / 보완 필요 상태입니다</text>
      <text x="57" y="376" font-size="10" fill="#0f766e">✓ 본인이 기안자입니다</text>
      <text x="57" y="398" font-size="8.5" fill="#66655f" textLength="151.0" lengthAdjust="spacingAndGlyphs">결재한 사람이 있으면 → 버튼이 사라집니다.</text>
    </g>

    <g>
      <rect x="260" y="270" width="200" height="150" rx="14" fill="#ffffff" stroke="#e7e3da"/>
      <circle cx="286" cy="298" r="14" fill="#dc2626"/>
      <text x="286" y="303" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700">2</text>
      <text x="310" y="294" font-size="11.5" font-weight="700" fill="#111315">취소 사유 입력</text>
      <text x="310" y="308" font-size="9.5" fill="#66655f">필수는 아니지만 작성 권장</text>
      <rect x="276" y="322" width="168" height="56" rx="9" fill="#f6f6f4" stroke="#d9d5cc"/>
      <text x="286" y="340" font-size="10" fill="#66655f">취소 사유 (선택)</text>
      <text x="286" y="358" font-size="9.5" fill="#8c8a83">예: 날짜를 잘못 입력…</text>
      <rect x="276" y="388" width="168" height="20" rx="7" fill="#feecec" stroke="#fbd5d5"/>
      <text x="286" y="402" font-size="9.5" fill="#b91c1c">최대 1000자</text>
    </g>

    <g>
      <rect x="490" y="270" width="200" height="150" rx="14" fill="#ffffff" stroke="#e7e3da"/>
      <circle cx="516" cy="298" r="14" fill="#dc2626"/>
      <text x="516" y="303" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700">3</text>
      <text x="540" y="294" font-size="11.5" font-weight="700" fill="#111315">요청서 취소 확인</text>
      <text x="540" y="308" font-size="9.5" fill="#66655f" textLength="144.0" lengthAdjust="spacingAndGlyphs">또는 "요청서 유지"를 눌러 나갑니다</text>
      <rect x="506" y="322" width="168" height="40" rx="9" fill="#f6f6f4" stroke="#e7e3da"/>
      <text x="516" y="340" font-size="10" fill="#111315">새 상태: 취소됨</text>
      <text x="516" y="355" font-size="9.5" fill="#66655f">되돌릴 수 없습니다</text>
      <rect x="506" y="372" width="168" height="28" rx="8" fill="#dc2626"/>
      <text x="590" y="390" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="700">요청서 취소 확인</text>
      <text x="506" y="414" font-size="8" fill="#66655f">결재를 기다리던 사람도 알림을 받습니다.</text>
    </g>

    <path d="M236 344 h18 m0 0 l-6 -5 m6 5 l-6 5" stroke="#9a968d" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M466 344 h18 m0 0 l-6 -5 m6 5 l-6 5" stroke="#9a968d" stroke-width="2" fill="none" stroke-linecap="round"/>

    <text x="360" y="452" font-size="11.5" fill="#66655f" text-anchor="middle">보완하면 요청서가 진행되고 취소하면 완전히 멈춥니다 — 둘 다 관리자 개입이 필요 없습니다</text>
  </g>
</svg>
