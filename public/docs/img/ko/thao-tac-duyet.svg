<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-label="Ba thao tác của người duyệt: duyệt, từ chối và yêu cầu bổ sung">
  <rect width="720" height="300" rx="16" fill="#f6f6f4"/>
  <g font-family="Inter, 'Segoe UI', Arial, sans-serif">
    <!-- Duyệt -->
    <g>
      <rect x="30" y="44" width="200" height="200" rx="14" fill="#ffffff" stroke="#e7e3da"/>
      <circle cx="58" cy="74" r="16" fill="#16a34a"/>
      <text x="84" y="70" font-size="12.5" font-weight="700" fill="#111315">요청서 결재</text>
      <text x="84" y="86" font-size="10" fill="#66655f">초록색 버튼</text>
      <rect x="46" y="102" width="168" height="30" rx="9" fill="#e6f5f3" stroke="#a7ded6"/>
      <text x="57" y="121" font-size="9.5" fill="#0f766e">다음 단계: 즉시 이동</text>
      <rect x="46" y="140" width="168" height="30" rx="9" fill="#e6f5f3" stroke="#a7ded6"/>
      <text x="57" y="159" font-size="9.5" fill="#0f766e">마지막 단계: 승인 완료</text>
      <rect x="46" y="178" width="168" height="52" rx="9" fill="#f6f6f4" stroke="#d9d5cc"/>
      <text x="56" y="196" font-size="9.5" fill="#66655f">다음 결재자와 기안자</text>
      <text x="56" y="212" font-size="9.5" fill="#66655f">모두 알림을 받습니다.</text>
      <text x="56" y="226" font-size="9.5" fill="#66655f">추가로 작성할 것은 없습니다.</text>
    </g>

    <!-- Từ chối -->
    <g>
      <rect x="260" y="44" width="200" height="200" rx="14" fill="#ffffff" stroke="#e7e3da"/>
      <circle cx="288" cy="74" r="16" fill="#dc2626"/>
      <text x="314" y="70" font-size="12.5" font-weight="700" fill="#111315">반려</text>
      <text x="314" y="86" font-size="10" fill="#66655f" textLength="140.0" lengthAdjust="spacingAndGlyphs">요청서는 여기서 완전히 멈춥니다</text>
      <rect x="276" y="102" width="168" height="30" rx="9" fill="#feecec" stroke="#fbd5d5"/>
      <text x="286" y="121" font-size="9.5" fill="#b91c1c" font-weight="600">사유 입력 필수</text>
      <rect x="276" y="140" width="168" height="52" rx="9" fill="#f6f6f4" stroke="#d9d5cc"/>
      <text x="286" y="158" font-size="9.5" fill="#66655f">"반려 사유" 대화상자</text>
      <text x="286" y="174" font-size="8.5" fill="#66655f">입력란이 비어 있으면 전송을 막습니다.</text>
      <text x="286" y="188" font-size="9.5" fill="#66655f">최대 1000자.</text>
      <rect x="276" y="200" width="168" height="30" rx="9" fill="#feecec" stroke="#fbd5d5"/>
      <text x="286" y="219" font-size="9.5" fill="#b91c1c">기안자가 이 사유를 받습니다</text>
    </g>

    <!-- Yêu cầu bổ sung -->
    <g>
      <rect x="490" y="44" width="200" height="200" rx="14" fill="#ffffff" stroke="#e7e3da"/>
      <circle cx="518" cy="74" r="16" fill="#a855f7"/>
      <text x="544" y="70" font-size="12.5" font-weight="700" fill="#111315">보완 요청</text>
      <text x="544" y="86" font-size="10" fill="#66655f">요청서가 기안자에게 반환</text>
      <rect x="506" y="102" width="168" height="30" rx="9" fill="#f4eefe" stroke="#ddd0fb"/>
      <text x="516" y="121" font-size="9.5" fill="#6d28d9" font-weight="600">무엇이 필요한지 반드시 명시</text>
      <rect x="506" y="140" width="168" height="52" rx="9" fill="#f6f6f4" stroke="#d9d5cc"/>
      <text x="516" y="158" font-size="9.5" fill="#66655f">요청서 상태가 다음으로 변경</text>
      <text x="516" y="174" font-size="9.5" fill="#66655f">"보완 요청" 상태로 유지</text>
      <text x="516" y="188" font-size="9.5" fill="#66655f">진행 중이던 단계로 돌아갑니다.</text>
      <rect x="506" y="200" width="168" height="30" rx="9" fill="#f4eefe" stroke="#ddd0fb"/>
      <text x="516" y="219" font-size="9.5" fill="#6d28d9">재상신 후 결재가 이어집니다</text>
    </g>

    <text x="360" y="270" font-size="12" fill="#66655f" text-anchor="middle">조작은 3가지뿐입니다. "다른 단계로 전달"이나 "기안자 대신 내용 수정"은 없습니다</text>
  </g>
</svg>
