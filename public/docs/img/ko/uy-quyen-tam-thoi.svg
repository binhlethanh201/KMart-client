<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 262" role="img" aria-label="Ba bước tạo ủy quyền tạm thời cho người duyệt khác trong khoảng thời gian vắng mặt">
  <rect width="720" height="262" rx="16" fill="#f6f6f4"/>
  <g font-family="Inter, 'Segoe UI', Arial, sans-serif">
    <!-- Bước 1 -->
    <g>
      <rect x="30" y="44" width="200" height="176" rx="14" fill="#ffffff" stroke="#e7e3da"/>
      <circle cx="58" cy="74" r="16" fill="#7c3aed"/>
      <text x="58" y="80" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700">1</text>
      <text x="84" y="70" font-size="12.5" font-weight="700" fill="#111315">임시 위임 열기</text>
      <text x="84" y="86" font-size="10" fill="#66655f">위임 → 임시 위임</text>
      <rect x="46" y="104" width="168" height="72" rx="9" fill="#f4eefe" stroke="#ddd0fb"/>
      <text x="56" y="122" font-size="9.5" fill="#6d28d9">장기간 자리를 비울 때 사용</text>
      <text x="56" y="140" font-size="9.5" fill="#6d28d9">요청서가 밀리지 않도록 합니다.</text>
      <text x="56" y="162" font-size="8.5" fill="#66655f">기본 색 "위임 생성" 버튼을 클릭합니다.</text>
      <text x="46" y="200" font-size="9.5" fill="#66655f">결재 권한이 있는 계정에만 표시됩니다.</text>
    </g>

    <!-- Bước 2 -->
    <g>
      <rect x="260" y="44" width="200" height="176" rx="14" fill="#ffffff" stroke="#e7e3da"/>
      <circle cx="288" cy="74" r="16" fill="#7c3aed"/>
      <text x="288" y="80" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700">2</text>
      <text x="314" y="70" font-size="12.5" font-weight="700" fill="#111315">3가지 정보 입력</text>
      <text x="314" y="86" font-size="10" fill="#66655f">모두 필수입니다</text>
      <rect x="276" y="102" width="168" height="26" rx="8" fill="#f6f6f4" stroke="#d9d5cc"/>
      <text x="286" y="119" font-size="9.5" fill="#3f3e3a">수임자</text>
      <rect x="276" y="134" width="168" height="26" rx="8" fill="#f6f6f4" stroke="#d9d5cc"/>
      <text x="286" y="151" font-size="9.5" fill="#3f3e3a">시작일 – 종료일</text>
      <rect x="276" y="166" width="168" height="44" rx="8" fill="#f6f6f4" stroke="#d9d5cc"/>
      <text x="286" y="183" font-size="9.5" fill="#3f3e3a">위임 사유</text>
      <text x="286" y="199" font-size="9" fill="#8c8a83">예: 10월 20일부터 휴가…</text>
    </g>

    <!-- Bước 3 -->
    <g>
      <rect x="490" y="44" width="200" height="176" rx="14" fill="#ffffff" stroke="#e7e3da"/>
      <circle cx="518" cy="74" r="16" fill="#16a34a"/>
      <text x="518" y="80" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700">3</text>
      <text x="544" y="70" font-size="9" font-weight="700" fill="#111315">효력 기간 동안</text>
      <text x="544" y="86" font-size="10" fill="#66655f">그리고 조기 종료 방법</text>
      <rect x="506" y="102" width="168" height="42" rx="9" fill="#e6f5f3" stroke="#a7ded6"/>
      <text x="516" y="120" font-size="8.5" fill="#0f766e" textLength="152.0" lengthAdjust="spacingAndGlyphs">본인에게 온 요청서 → 수임자가 처리하며,</text>
      <text x="516" y="135" font-size="9.5" fill="#0f766e">"누구를 대신해 결재하는지" 명시</text>
      <rect x="506" y="152" width="80" height="26" rx="8" fill="#ffffff" stroke="#e7e3da"/>
      <text x="546" y="169" font-size="9.5" fill="#3f3e3a" text-anchor="middle">담당자 변경</text>
      <rect x="594" y="152" width="80" height="26" rx="8" fill="#ffffff" stroke="#e7e3da"/>
      <text x="634" y="169" font-size="9.5" fill="#b91c1c" text-anchor="middle">회수</text>
      <text x="506" y="196" font-size="9.5" fill="#66655f" textLength="178.0" lengthAdjust="spacingAndGlyphs">기간이 끝나면 권한은 자동으로 돌아옵니다.</text>
      <text x="506" y="210" font-size="9.5" fill="#66655f">회수하면 즉시 효력이 사라집니다.</text>
    </g>

    <path d="M236 132 h18 m0 0 l-6 -5 m6 5 l-6 5" stroke="#9a968d" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M466 132 h18 m0 0 l-6 -5 m6 5 l-6 5" stroke="#9a968d" stroke-width="2" fill="none" stroke-linecap="round"/>

    <text x="360" y="240" font-size="12" fill="#66655f" text-anchor="middle">임시 위임은 새 요청서와 이미 대기 중인 요청서 모두를 처리합니다</text>
  </g>
</svg>
