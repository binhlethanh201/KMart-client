<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-label="Bốn nhóm thiết lập của một bước duyệt: hình thức duyệt, quy tắc nhiều người, thời hạn xử lý và thứ tự bước">
  <rect width="720" height="420" rx="16" fill="#f6f6f4"/>
  <g font-family="Inter, 'Segoe UI', Arial, sans-serif">
    <text x="30" y="30" font-size="13" font-weight="700" fill="#111315">Một bước duyệt có 4 nhóm thiết lập — không phải 5</text>

    <!-- A -->
    <g>
      <rect x="30" y="44" width="320" height="150" rx="14" fill="#ffffff" stroke="#e7e3da"/>
      <rect x="44" y="58" width="26" height="26" rx="8" fill="#1d4ed8"/>
      <text x="57" y="76" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700">A</text>
      <text x="80" y="68" font-size="11.5" font-weight="700" fill="#111315">Hình thức duyệt</text>
      <text x="80" y="82" font-size="9.5" fill="#66655f">Ai là người duyệt bước này</text>
      <rect x="44" y="94" width="292" height="24" rx="8" fill="#eef4ff" stroke="#c7d7fe"/>
      <text x="54" y="110" font-size="9.5" fill="#1d4ed8">Cấp quản lý trực tiếp — chọn: QLTT / Phó phòng / Trưởng phòng</text>
      <rect x="44" y="122" width="292" height="24" rx="8" fill="#eef4ff" stroke="#c7d7fe"/>
      <text x="54" y="138" font-size="9.5" fill="#1d4ed8">Chuỗi quản lý liên tiếp — chọn cấp đầu và cấp cuối</text>
      <rect x="44" y="150" width="292" height="24" rx="8" fill="#eef4ff" stroke="#c7d7fe"/>
      <text x="54" y="166" font-size="9.5" fill="#1d4ed8">Duyệt theo sắp xếp — chọn chức vụ / nhóm người cụ thể</text>
      <text x="44" y="188" font-size="9.5" fill="#66655f">Hoặc: Chỉ định 1 người cụ thể — đơn luôn tới đúng người đó</text>
    </g>

    <!-- B -->
    <g>
      <rect x="370" y="44" width="320" height="150" rx="14" fill="#ffffff" stroke="#e7e3da"/>
      <rect x="384" y="58" width="26" height="26" rx="8" fill="#7c3aed"/>
      <text x="397" y="76" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700">B</text>
      <text x="420" y="68" font-size="11.5" font-weight="700" fill="#111315">Quy tắc khi nhiều người duyệt</text>
      <text x="420" y="82" font-size="9.5" fill="#66655f">Chỉ dùng cho hình thức "theo sắp xếp"</text>
      <rect x="384" y="94" width="292" height="24" rx="8" fill="#f4eefe" stroke="#ddd0fb"/>
      <text x="394" y="110" font-size="9.5" fill="#6d28d9">Duyệt lần lượt  A ➔ B ➔ C  (bắt buộc chọn đủ người theo thứ tự)</text>
      <rect x="384" y="122" width="292" height="24" rx="8" fill="#f4eefe" stroke="#ddd0fb"/>
      <text x="394" y="138" font-size="9.5" fill="#6d28d9">Đồng thời — cần TẤT CẢ đồng ý mới qua bước</text>
      <rect x="384" y="150" width="292" height="24" rx="8" fill="#f4eefe" stroke="#ddd0fb"/>
      <text x="394" y="166" font-size="9.5" fill="#6d28d9">Đồng thời — CHỈ CẦN 1 người đồng ý là qua bước</text>
      <text x="384" y="188" font-size="9.5" fill="#66655f">Bước chỉ có 1 người được chỉ định thì bỏ qua nhóm này.</text>
    </g>

    <!-- C -->
    <g>
      <rect x="30" y="208" width="320" height="150" rx="14" fill="#ffffff" stroke="#e7e3da"/>
      <rect x="44" y="222" width="26" height="26" rx="8" fill="#d97706"/>
      <text x="57" y="240" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700">C</text>
      <text x="80" y="232" font-size="11.5" font-weight="700" fill="#111315">Xử lý quá hạn</text>
      <text x="80" y="246" font-size="9.5" fill="#66655f">Bật/tắt rồi nhập số giờ</text>
      <rect x="44" y="258" width="292" height="24" rx="8" fill="#fff7e6" stroke="#f0d9a8"/>
      <text x="54" y="274" font-size="9.5" fill="#8a5a00">☑ Tự động xử lý đơn khi quá thời hạn không duyệt · 12 giờ</text>
      <rect x="44" y="286" width="292" height="24" rx="8" fill="#fff7e6" stroke="#f0d9a8"/>
      <text x="54" y="302" font-size="9.5" fill="#8a5a00">Chế độ: đếm 12 giờ liên tục · hoặc chỉ tính giờ hành chính</text>
      <rect x="44" y="314" width="292" height="24" rx="8" fill="#feecec" stroke="#fbd5d5"/>
      <text x="54" y="330" font-size="8" fill="#b91c1c">Hành động: Trả đơn về nơi khởi tạo · Duyệt theo ủy quyền quá hạn</text>
      <text x="44" y="352" font-size="8" fill="#66655f">Chỉ có 2 hành động. Không còn lựa chọn "tự động chuyển lên cấp trên".</text>
    </g>

    <!-- D -->
    <g>
      <rect x="370" y="208" width="320" height="150" rx="14" fill="#ffffff" stroke="#e7e3da"/>
      <rect x="384" y="222" width="26" height="26" rx="8" fill="#16a34a"/>
      <text x="397" y="240" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700">D</text>
      <text x="420" y="232" font-size="11.5" font-weight="700" fill="#111315">Thứ tự bước &amp; phạm vi</text>
      <text x="420" y="246" font-size="9.5" fill="#66655f">Ngoài 3 nhóm trên, mỗi bước còn có:</text>
      <rect x="384" y="258" width="292" height="24" rx="8" fill="#e6f5f3" stroke="#a7ded6"/>
      <text x="394" y="274" font-size="9.5" fill="#0f766e">Kéo thả để đổi thứ tự bước · gạt công tắc để tắt bước</text>
      <rect x="384" y="286" width="292" height="24" rx="8" fill="#e6f5f3" stroke="#a7ded6"/>
      <text x="394" y="302" font-size="9.5" fill="#0f766e">Phạm vi: tự theo nơi làm việc · riêng Văn phòng · riêng Cửa hàng</text>
      <text x="384" y="330" font-size="9.5" fill="#66655f">Lý do từ chối LUÔN bắt buộc — hệ thống không cho tắt (cố định).</text>
      <text x="384" y="352" font-size="8" fill="#66655f">Bước có điều kiện (theo số ngày nghỉ / số giờ OT) chưa có trên giao diện.</text>
    </g>
  </g>
</svg>
