<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-label="Sơ đồ luồng duyệt nhiều cấp">
  <rect width="720" height="320" rx="16" fill="#f6f6f4"/>
  <g font-family="Inter, 'Segoe UI', Arial, sans-serif">
    <!-- Người gửi -->
    <g>
      <rect x="280" y="20" width="160" height="52" rx="12" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/>
      <circle cx="308" cy="46" r="14" fill="#f59e0b"/>
      <text x="308" y="51" font-size="11" fill="#7c2d12" text-anchor="middle" font-weight="700">NT</text>
      <text x="330" y="42" font-size="12" font-weight="700" fill="#111315">Người gửi</text>
      <text x="330" y="58" font-size="10" fill="#66655f">Tạo &amp; gửi đơn</text>
    </g>
    <path d="M360 72 v22 m0 0 l-5 -6 m5 6 l5 -6" stroke="#1d4ed8" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- Bước 1 -->
    <g>
      <rect x="280" y="98" width="160" height="52" rx="12" fill="#ffffff" stroke="#e7e3da"/>
      <circle cx="308" cy="124" r="14" fill="#1d4ed8"/>
      <text x="308" y="129" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700">B1</text>
      <text x="330" y="120" font-size="12" font-weight="700" fill="#111315">Trưởng phòng</text>
      <text x="330" y="136" font-size="10" fill="#66655f">Duyệt cấp 1</text>
      <rect x="452" y="110" width="86" height="26" rx="13" fill="#eef4ff" stroke="#c7d7fe"/>
      <text x="495" y="127" font-size="10" fill="#3b5bd6" text-anchor="middle">12 giờ / bước</text>
    </g>
    <path d="M360 150 v22 m0 0 l-5 -6 m5 6 l5 -6" stroke="#1d4ed8" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- Bước 2: song song 2 người -->
    <g>
      <rect x="180" y="176" width="160" height="52" rx="12" fill="#ffffff" stroke="#e7e3da"/>
      <circle cx="208" cy="202" r="14" fill="#7c9bf0"/>
      <text x="208" y="207" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700">B2</text>
      <text x="230" y="198" font-size="12" font-weight="700" fill="#111315">Giám đốc khối</text>
      <text x="230" y="214" font-size="10" fill="#66655f">Duyệt song song</text>
      <rect x="380" y="176" width="160" height="52" rx="12" fill="#ffffff" stroke="#e7e3da"/>
      <circle cx="408" cy="202" r="14" fill="#7c9bf0"/>
      <text x="408" y="207" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700">B2</text>
      <text x="430" y="198" font-size="12" font-weight="700" fill="#111315">Trưởng NS</text>
      <text x="430" y="214" font-size="10" fill="#66655f">Duyệt song song</text>
      <path d="M360 172 v-0 M300 176 v-10 h120 v10" stroke="#9a968d" stroke-width="2" fill="none"/>
    </g>
    <path d="M360 228 v22 m0 0 l-5 -6 m5 6 l5 -6" stroke="#059669" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- Hoàn tất -->
    <g>
      <rect x="290" y="254" width="140" height="44" rx="12" fill="#ecfdf5" stroke="#059669"/>
      <text x="360" y="281" font-size="13" font-weight="700" fill="#047857" text-anchor="middle">Hoàn tất ✓</text>
    </g>
    <!-- chú thích quá hạn -->
    <g>
      <rect x="560" y="176" width="130" height="70" rx="10" fill="#fff7ed" stroke="#f59e0b"/>
      <text x="572" y="198" font-size="11" font-weight="700" fill="#b45309">Quá hạn?</text>
      <text x="572" y="214" font-size="10" fill="#92400e">Trả về / chuyển</text>
      <text x="572" y="228" font-size="10" fill="#92400e">người duyệt thay</text>
      <path d="M560 210 h-16" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4 3"/>
    </g>
    <text x="360" y="312" font-size="12" fill="#66655f" text-anchor="middle">Luồng nhiều cấp: tuần tự rồi song song; mỗi bước có thời hạn và hành động khi quá hạn</text>
  </g>
</svg>
