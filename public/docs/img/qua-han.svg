<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-label="Vòng đời xử lý quá hạn: nhắc trước hạn một lần, quá hạn thì trả về hoặc chuyển người duyệt thay, quá hạn lần hai thì hủy đơn">
  <rect width="720" height="360" rx="16" fill="#f6f6f4"/>
  <g font-family="Inter, 'Segoe UI', Arial, sans-serif">
    <text x="30" y="30" font-size="13" font-weight="700" fill="#111315">Điều gì xảy ra với một bước duyệt theo thời gian</text>

    <!-- Trục thời gian -->
    <line x1="60" y1="96" x2="672" y2="96" stroke="#d9d5cc" stroke-width="2"/>
    <path d="M672 96 l-8 -4 v8 z" fill="#d9d5cc"/>

    <!-- Mốc 1: trước hạn -->
    <circle cx="130" cy="96" r="9" fill="#1d4ed8"/>
    <rect x="52" y="118" width="156" height="96" rx="12" fill="#ffffff" stroke="#e7e3da"/>
    <text x="64" y="138" font-size="10.5" font-weight="700" fill="#1d4ed8">Sắp hết hạn</text>
    <text x="64" y="156" font-size="9.5" fill="#3f3e3a">Người duyệt hiện tại nhận</text>
    <text x="64" y="170" font-size="9.5" fill="#3f3e3a">"Sắp hết hạn duyệt đơn"</text>
    <text x="64" y="188" font-size="9.5" fill="#66655f">· kèm link xem đơn</text>
    <text x="64" y="204" font-size="9.5" fill="#66655f">· nhắc đúng 1 lần / mỗi bước</text>

    <!-- Mốc 2: hết hạn -->
    <circle cx="360" cy="96" r="9" fill="#d97706"/>
    <rect x="272" y="118" width="176" height="96" rx="12" fill="#ffffff" stroke="#e7e3da"/>
    <text x="284" y="138" font-size="10.5" font-weight="700" fill="#b45309">Quá hạn</text>
    <text x="284" y="156" font-size="9.5" fill="#3f3e3a">Hệ thống tự xử lý theo</text>
    <text x="284" y="170" font-size="9.5" fill="#3f3e3a">hành động cấu hình ở bước</text>
    <text x="284" y="188" font-size="9.5" fill="#66655f">Người duyệt không làm gì cũng bị</text>
    <text x="284" y="202" font-size="9.5" fill="#66655f">xử lý thay — đơn không bị treo.</text>

    <!-- Nhánh A -->
    <g>
      <path d="M400 118 v-14 h132 v14" stroke="#9a968d" stroke-width="1.5" fill="none"/>
      <rect x="470" y="60" width="202" height="46" rx="10" fill="#ffffff" stroke="#e7e3da"/>
      <rect x="480" y="72" width="8" height="22" rx="4" fill="#dc2626"/>
      <text x="498" y="80" font-size="10.5" font-weight="700" fill="#111315">A · Trả đơn về nơi khởi tạo</text>
      <text x="498" y="95" font-size="9.5" fill="#66655f">Người tạo nhận "đã hết hạn duyệt"</text>
    </g>

    <!-- Nhánh B -->
    <g>
      <path d="M400 214 v14 h132 v-14" stroke="#9a968d" stroke-width="1.5" fill="none"/>
      <rect x="470" y="228" width="202" height="46" rx="10" fill="#ffffff" stroke="#e7e3da"/>
      <rect x="480" y="240" width="8" height="22" rx="4" fill="#7c3aed"/>
      <text x="498" y="248" font-size="10.5" font-weight="700" fill="#111315">B · Duyệt theo ủy quyền quá hạn</text>
      <text x="498" y="263" font-size="9.5" fill="#66655f">Chuyển cho người duyệt thay đã cài</text>
    </g>

    <!-- Mốc 3: quá hạn lần 2 -->
    <circle cx="620" cy="96" r="9" fill="#dc2626"/>
    <rect x="512" y="118" width="160" height="96" rx="12" fill="#fff1f1" stroke="#fbd5d5"/>
    <text x="524" y="138" font-size="10.5" font-weight="700" fill="#b91c1c">Quá hạn lần thứ hai</text>
    <text x="524" y="156" font-size="9.5" fill="#7f1d1d">Người duyệt thay cũng không</text>
    <text x="524" y="170" font-size="9.5" fill="#7f1d1d">xử lý kịp → đơn bị HỦY</text>
    <text x="524" y="188" font-size="9.5" fill="#b91c1c">Chưa cài người duyệt thay</text>
    <text x="524" y="202" font-size="9.5" fill="#b91c1c">cũng bị hủy như vậy.</text>
    <text x="360" y="220" font-size="0" fill="#66655f">.</text>

    <!-- Ghi chú dưới -->
    <rect x="30" y="292" width="660" height="50" rx="12" fill="#eef4ff" stroke="#c7d7fe"/>
    <text x="46" y="312" font-size="10.5" font-weight="700" fill="#1d4ed8">Thông báo Telegram đi kèm</text>
    <text x="46" y="330" font-size="10" fill="#3b5bd6">"Đơn quá hạn đã chuyển người duyệt thay" · "Đơn đã bị hủy, trả về bạn" — gửi cho cả người tạo và người duyệt liên quan</text>
  </g>
</svg>
