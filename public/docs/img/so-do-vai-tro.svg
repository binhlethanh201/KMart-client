<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 344" role="img" aria-label="Bản đồ bốn vai trò trong hệ thống KMart và việc chính của từng vai trò">
  <rect width="720" height="344" rx="16" fill="#f6f6f4"/>
  <g font-family="Inter, 'Segoe UI', Arial, sans-serif">
    <text x="30" y="30" font-size="14" font-weight="700" fill="#111315">Bốn vai trò — chọn đúng phần bạn cần đọc</text>

    <!-- Nhân viên -->
    <g>
      <rect x="30" y="44" width="150" height="206" rx="14" fill="#ffffff" stroke="#e7e3da"/>
      <circle cx="60" cy="76" r="15" fill="#0d9488"/>
      <text x="60" y="81" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700">NV</text>
      <text x="84" y="72" font-size="12" font-weight="700" fill="#111315">Nhân viên</text>
      <text x="84" y="88" font-size="10" fill="#66655f">STAFF</text>
      <line x1="44" y1="104" x2="166" y2="104" stroke="#eeece7"/>
      <circle cx="52" cy="124" r="3" fill="#0d9488"/><text x="62" y="128" font-size="10.5" fill="#3f3e3a">Tạo đơn của mình</text>
      <circle cx="52" cy="146" r="3" fill="#0d9488"/><text x="62" y="150" font-size="10.5" fill="#3f3e3a">Theo dõi tiến độ</text>
      <circle cx="52" cy="168" r="3" fill="#0d9488"/><text x="62" y="172" font-size="10.5" fill="#3f3e3a">Bổ sung hồ sơ</text>
      <circle cx="52" cy="190" r="3" fill="#0d9488"/><text x="62" y="194" font-size="10.5" fill="#3f3e3a">Hủy đơn chưa duyệt</text>
      <circle cx="52" cy="212" r="3" fill="#0d9488"/><text x="62" y="216" font-size="10.5" fill="#3f3e3a">Kết nối Telegram</text>
      <rect x="44" y="224" width="122" height="18" rx="9" fill="#e6f5f3"/>
      <text x="105" y="237" font-size="10" fill="#0f766e" text-anchor="middle" font-weight="600">Mục 2</text>
    </g>

    <!-- Người duyệt -->
    <g>
      <rect x="200" y="44" width="150" height="206" rx="14" fill="#ffffff" stroke="#e7e3da"/>
      <circle cx="230" cy="76" r="15" fill="#7c3aed"/>
      <text x="230" y="81" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700">D</text>
      <text x="254" y="72" font-size="12" font-weight="700" fill="#111315">Người duyệt</text>
      <text x="254" y="88" font-size="10" fill="#66655f">QL / TN / TP / GĐ</text>
      <line x1="214" y1="104" x2="336" y2="104" stroke="#eeece7"/>
      <circle cx="222" cy="124" r="3" fill="#7c3aed"/><text x="232" y="128" font-size="10.5" fill="#3f3e3a">Hàng chờ của tôi</text>
      <circle cx="222" cy="146" r="3" fill="#7c3aed"/><text x="232" y="150" font-size="10.5" fill="#3f3e3a">Duyệt / Từ chối</text>
      <circle cx="222" cy="168" r="3" fill="#7c3aed"/><text x="232" y="172" font-size="10.5" fill="#3f3e3a">Yêu cầu bổ sung</text>
      <circle cx="222" cy="190" r="3" fill="#7c3aed"/><text x="232" y="194" font-size="10.5" fill="#3f3e3a">Ủy quyền tạm thời</text>
      <circle cx="222" cy="212" r="3" fill="#7c3aed"/><text x="232" y="216" font-size="10.5" fill="#3f3e3a">Duyệt thay quá hạn</text>
      <rect x="214" y="224" width="122" height="18" rx="9" fill="#f4eefe"/>
      <text x="275" y="237" font-size="10" fill="#6d28d9" text-anchor="middle" font-weight="600">Mục 3</text>
    </g>

    <!-- Nhân sự -->
    <g>
      <rect x="370" y="44" width="150" height="206" rx="14" fill="#ffffff" stroke="#e7e3da"/>
      <circle cx="400" cy="76" r="15" fill="#4f46e5"/>
      <text x="400" y="81" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700">HR</text>
      <text x="424" y="72" font-size="12" font-weight="700" fill="#111315">Nhân sự</text>
      <text x="424" y="88" font-size="10" fill="#66655f">HR</text>
      <line x1="384" y1="104" x2="506" y2="104" stroke="#eeece7"/>
      <circle cx="392" cy="124" r="3" fill="#4f46e5"/><text x="402" y="128" font-size="10.5" fill="#3f3e3a">Danh sách &amp; lọc NS</text>
      <circle cx="392" cy="146" r="3" fill="#4f46e5"/><text x="402" y="150" font-size="10.5" fill="#3f3e3a">Tạo tài khoản</text>
      <circle cx="392" cy="168" r="3" fill="#4f46e5"/><text x="402" y="172" font-size="10.5" fill="#3f3e3a">Đặt lại mật khẩu</text>
      <circle cx="392" cy="190" r="3" fill="#4f46e5"/><text x="402" y="194" font-size="10.5" fill="#3f3e3a">Phòng ban &amp; Nhóm</text>
      <circle cx="392" cy="212" r="3" fill="#4f46e5"/><text x="402" y="216" font-size="10.5" fill="#3f3e3a">Báo cáo, xuất Excel</text>
      <rect x="384" y="224" width="122" height="18" rx="9" fill="#eceafe"/>
      <text x="445" y="237" font-size="10" fill="#4338ca" text-anchor="middle" font-weight="600">Mục 4</text>
    </g>

    <!-- Quản trị -->
    <g>
      <rect x="540" y="44" width="150" height="206" rx="14" fill="#ffffff" stroke="#e7e3da"/>
      <circle cx="570" cy="76" r="15" fill="#e11d48"/>
      <text x="570" y="81" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700">Q</text>
      <text x="594" y="72" font-size="12" font-weight="700" fill="#111315">Quản trị</text>
      <text x="594" y="88" font-size="10" fill="#66655f">ADMIN</text>
      <line x1="554" y1="104" x2="676" y2="104" stroke="#eeece7"/>
      <circle cx="562" cy="124" r="3" fill="#e11d48"/><text x="572" y="128" font-size="10.5" fill="#3f3e3a">Mẫu đơn &amp; Form</text>
      <circle cx="562" cy="146" r="3" fill="#e11d48"/><text x="572" y="150" font-size="10.5" fill="#3f3e3a">Chức vụ &amp; cấp bậc</text>
      <circle cx="562" cy="168" r="3" fill="#e11d48"/><text x="572" y="172" font-size="10.5" fill="#3f3e3a">Luồng duyệt</text>
      <circle cx="562" cy="190" r="3" fill="#e11d48"/><text x="572" y="194" font-size="10.5" fill="#3f3e3a">Chung &amp; Telegram</text>
      <circle cx="562" cy="212" r="3" fill="#e11d48"/><text x="572" y="216" font-size="10.5" fill="#3f3e3a">Báo cáo toàn hệ thống</text>
      <rect x="554" y="224" width="122" height="18" rx="9" fill="#feecec"/>
      <text x="615" y="237" font-size="10" fill="#be123c" text-anchor="middle" font-weight="600">Mục 5</text>
    </g>

    <!-- Dùng chung -->
    <rect x="30" y="264" width="660" height="56" rx="12" fill="#eef4ff" stroke="#c7d7fe"/>
    <text x="46" y="288" font-size="12" font-weight="700" fill="#1d4ed8">Dùng chung cho MỌI vai trò (mục 1 và 6)</text>
    <text x="46" y="306" font-size="11" fill="#3b5bd6">Đăng nhập · Đổi mật khẩu bắt buộc · Chuông thông báo · Kết nối Telegram · Đổi ngôn ngữ VI / EN / KO</text>
  </g>
</svg>
