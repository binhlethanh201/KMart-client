<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-label="Minh họa ba bước tạo đơn mới">
  <rect width="720" height="300" rx="16" fill="#f6f6f4"/>
  <g font-family="Inter, 'Segoe UI', Arial, sans-serif">
    <!-- Bước 1: chọn loại đơn -->
    <g>
      <rect x="30" y="50" width="200" height="180" rx="14" fill="#ffffff" stroke="#e7e3da"/>
      <circle cx="66" cy="86" r="18" fill="#1d4ed8"/>
      <text x="66" y="92" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="700">1</text>
      <text x="94" y="82" font-size="14" font-weight="700" fill="#111315">Chọn loại đơn</text>
      <text x="94" y="100" font-size="11" fill="#66655f">Nghỉ phép, OT, mua sắm…</text>
      <rect x="48" y="122" width="164" height="34" rx="8" fill="#f6f6f4" stroke="#d9d5cc"/>
      <text x="60" y="143" font-size="12" fill="#111315">Đơn xin nghỉ phép</text>
      <path d="M196 139 l6 6 6 -6" stroke="#66655f" stroke-width="2" fill="none" stroke-linecap="round"/>
      <rect x="48" y="166" width="164" height="12" rx="6" fill="#eeece7"/>
      <rect x="48" y="186" width="120" height="12" rx="6" fill="#eeece7"/>
    </g>
    <!-- Bước 2: điền biểu mẫu -->
    <g>
      <rect x="260" y="50" width="200" height="180" rx="14" fill="#ffffff" stroke="#e7e3da"/>
      <circle cx="296" cy="86" r="18" fill="#1d4ed8"/>
      <text x="296" y="92" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="700">2</text>
      <text x="324" y="82" font-size="14" font-weight="700" fill="#111315">Điền biểu mẫu</text>
      <text x="324" y="100" font-size="11" fill="#66655f">Ô động theo loại đơn</text>
      <rect x="278" y="118" width="76" height="30" rx="7" fill="#f6f6f4" stroke="#d9d5cc"/>
      <text x="286" y="137" font-size="10" fill="#66655f">Từ ngày</text>
      <rect x="366" y="118" width="76" height="30" rx="7" fill="#f6f6f4" stroke="#d9d5cc"/>
      <text x="374" y="137" font-size="10" fill="#66655f">Đến ngày</text>
      <rect x="278" y="158" width="164" height="46" rx="8" fill="#f6f6f4" stroke="#d9d5cc"/>
      <text x="286" y="176" font-size="10" fill="#66655f">Lý do / Mô tả *</text>
      <rect x="286" y="184" width="120" height="8" rx="4" fill="#ddd8cf"/>
    </g>
    <!-- Bước 3: xem luồng & gửi -->
    <g>
      <rect x="490" y="50" width="200" height="180" rx="14" fill="#ffffff" stroke="#e7e3da"/>
      <circle cx="526" cy="86" r="18" fill="#1d4ed8"/>
      <text x="526" y="92" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="700">3</text>
      <text x="554" y="82" font-size="14" font-weight="700" fill="#111315">Xem luồng &amp; gửi</text>
      <text x="554" y="100" font-size="11" fill="#66655f">Kiểm tra người duyệt</text>
      <rect x="508" y="116" width="164" height="52" rx="8" fill="#eef4ff" stroke="#c7d7fe"/>
      <circle cx="528" cy="136" r="9" fill="#1d4ed8"/>
      <circle cx="556" cy="136" r="9" fill="#7c9bf0"/>
      <circle cx="584" cy="136" r="9" fill="#b6c6f5"/>
      <path d="M537 136 h10 M565 136 h10" stroke="#1d4ed8" stroke-width="2"/>
      <text x="516" y="160" font-size="10" fill="#3b5bd6">Đường đi của đơn</text>
      <rect x="508" y="180" width="164" height="30" rx="8" fill="#1d4ed8"/>
      <text x="590" y="199" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700">Gửi yêu cầu</text>
    </g>
    <!-- mũi tên nối -->
    <path d="M236 140 h16 m0 0 l-6 -5 m6 5 l-6 5" stroke="#9a968d" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M466 140 h16 m0 0 l-6 -5 m6 5 l-6 5" stroke="#9a968d" stroke-width="2" fill="none" stroke-linecap="round"/>
    <text x="360" y="268" font-size="12" fill="#66655f" text-anchor="middle">Ba bước tạo đơn: chọn loại đơn → điền biểu mẫu động → xem luồng duyệt rồi gửi</text>
  </g>
</svg>
