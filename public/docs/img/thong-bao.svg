<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-label="Hai kênh nhận thông báo: chuông trong hệ thống và tin nhắn Telegram có link Xem chi tiết">
  <rect width="720" height="300" rx="16" fill="#f6f6f4"/>
  <g font-family="Inter, 'Segoe UI', Arial, sans-serif">
    <!-- Nguồn -->
    <rect x="30" y="120" width="150" height="70" rx="12" fill="#ffffff" stroke="#e7e3da"/>
    <text x="105" y="146" font-size="11" font-weight="700" fill="#111315" text-anchor="middle">Sự kiện của đơn</text>
    <text x="105" y="162" font-size="9.5" fill="#66655f" text-anchor="middle">đến lượt bạn duyệt</text>
    <text x="105" y="176" font-size="9.5" fill="#66655f" text-anchor="middle">sắp hết hạn · quá hạn…</text>

    <path d="M184 148 h34 m0 0 l-6 -5 m6 5 l-6 5" stroke="#9a968d" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M184 178 h34 m0 0 l-6 -5 m6 5 l-6 5" stroke="#9a968d" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M182 148 v0" stroke="none"/>

    <!-- Kênh 1: chuông -->
    <g>
      <rect x="222" y="40" width="198" height="196" rx="14" fill="#ffffff" stroke="#e7e3da"/>
      <circle cx="248" cy="70" r="14" fill="#1d4ed8"/>
      <text x="248" y="75" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700">1</text>
      <text x="272" y="66" font-size="11.5" font-weight="700" fill="#111315">Chuông trong hệ thống</text>
      <text x="272" y="80" font-size="9.5" fill="#66655f">Luôn có, không cần cài gì</text>
      <rect x="238" y="94" width="166" height="28" rx="8" fill="#f6f6f4" stroke="#e7e3da"/>
      <text x="248" y="112" font-size="10" fill="#111315">Chuông thông báo</text>
      <circle cx="384" cy="108" r="8" fill="#dc2626"/>
      <text x="384" y="112" font-size="9" fill="#ffffff" text-anchor="middle" font-weight="700">3</text>
      <rect x="238" y="130" width="166" height="94" rx="9" fill="#eef4ff" stroke="#c7d7fe"/>
      <text x="248" y="148" font-size="12" fill="#111315">Xem danh sách</text>
      <text x="248" y="164" font-size="9.5" fill="#3b5bd6">Chấm đỏ = số thông báo chưa đọc</text>
      <text x="248" y="182" font-size="9.5" fill="#3b5bd6">Bấm 1 dòng để mở đúng đơn</text>
      <text x="248" y="202" font-size="8" fill="#66655f">Máy tính: chuông nằm cạnh tên bạn</text>
      <text x="248" y="216" font-size="9.5" fill="#66655f">Điện thoại: chuông ở góc trên phải</text>
    </g>

    <!-- Kênh 2: telegram -->
    <g>
      <rect x="444" y="40" width="246" height="196" rx="14" fill="#ffffff" stroke="#e7e3da"/>
      <circle cx="470" cy="70" r="14" fill="#229ed9"/>
      <text x="470" y="75" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700">2</text>
      <text x="494" y="66" font-size="11.5" font-weight="700" fill="#111315">Telegram (nếu đã kết nối)</text>
      <text x="494" y="80" font-size="9.5" fill="#66655f">Nhanh hơn, có ngay trên điện thoại</text>

      <rect x="460" y="94" width="214" height="128" rx="10" fill="#e7f5fd" stroke="#b6e0f5"/>
      <rect x="472" y="106" width="190" height="70" rx="10" fill="#ffffff" stroke="#d3ebf8"/>
      <text x="482" y="124" font-size="9.5" font-weight="700" fill="#111315">Có đơn cần duyệt</text>
      <text x="482" y="140" font-size="9" fill="#3f3e3a">Đơn xin nghỉ phép của Nguyễn Văn A</text>
      <text x="482" y="154" font-size="9" fill="#3f3e3a">còn khoảng 4 giờ là hết hạn duyệt.</text>
      <text x="482" y="170" font-size="9" fill="#1d4ed8" text-decoration="underline">Xem chi tiết</text>
      <rect x="472" y="184" width="190" height="28" rx="9" fill="#229ed9"/>
      <text x="567" y="202" font-size="9.5" fill="#ffffff" text-anchor="middle" font-weight="700">Mở Telegram → bấm link</text>
      <text x="460" y="230" font-size="9.5" fill="#66655f">Link "Xem chi tiết" mở thẳng trang đơn trên web.</text>
    </g>

    <text x="360" y="272" font-size="12" fill="#66655f" text-anchor="middle">Cùng một sự kiện được đẩy ra hai kênh — bạn không cần bật cả hai</text>
  </g>
</svg>
