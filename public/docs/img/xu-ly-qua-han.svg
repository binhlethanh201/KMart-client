<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-label="Cấu hình xử lý quá hạn: hai hành động của bước duyệt và chế độ đếm giờ mặc định toàn hệ thống">
  <rect width="720" height="300" rx="16" fill="#f6f6f4"/>
  <g font-family="Inter, 'Segoe UI', Arial, sans-serif">
    <!-- Nhánh quyết định -->
    <g>
      <rect x="30" y="36" width="330" height="228" rx="14" fill="#ffffff" stroke="#e7e3da"/>
      <text x="46" y="60" font-size="11.5" font-weight="700" fill="#111315">Bước duyệt quá hạn → hệ thống rẽ 2 nhánh</text>
      <text x="46" y="76" font-size="9.5" fill="#66655f">Cấu hình ở Cấu hình → Luồng duyệt → nhóm "Xử lý quá hạn"</text>

      <rect x="46" y="90" width="298" height="30" rx="9" fill="#fff7e6" stroke="#f0d9a8"/>
      <text x="56" y="109" font-size="9.5" fill="#8a5a00">☑ Quá hạn 12 giờ · đếm liên tục / giờ hành chính</text>

      <path d="M195 120 v16" stroke="#9a968d" stroke-width="1.5" fill="none"/>
      <path d="M100 136 h190 M100 136 v14 M290 136 v14" stroke="#9a968d" stroke-width="1.5" fill="none"/>

      <rect x="46" y="152" width="130" height="56" rx="9" fill="#feecec" stroke="#fbd5d5"/>
      <text x="56" y="170" font-size="9.5" font-weight="700" fill="#b91c1c">Trả đơn về nơi khởi tạo</text>
      <text x="56" y="186" font-size="9" fill="#b91c1c">Đơn về người gửi,</text>
      <text x="56" y="199" font-size="9" fill="#b91c1c">không chuyển cho ai.</text>

      <rect x="214" y="152" width="130" height="56" rx="9" fill="#f4eefe" stroke="#ddd0fb"/>
      <text x="224" y="170" font-size="9.5" font-weight="700" fill="#6d28d9">Duyệt theo ủy quyền</text>
      <text x="224" y="186" font-size="9" fill="#6d28d9">Chuyển cho người duyệt</text>
      <text x="224" y="199" font-size="9" fill="#6d28d9">thay đã cài ở màn Ủy quyền.</text>

      <rect x="46" y="220" width="298" height="34" rx="9" fill="#e6f5f3" stroke="#a7ded6"/>
      <text x="56" y="236" font-size="9" fill="#0f766e">Người duyệt thay cũng quá hạn, hoặc chưa cài người duyệt thay</text>
      <text x="56" y="249" font-size="9" fill="#0f766e">→ đơn bị HỦY và trả về người tạo.</text>
    </g>

    <!-- Chế độ đếm giờ -->
    <g>
      <rect x="380" y="36" width="310" height="228" rx="14" fill="#ffffff" stroke="#e7e3da"/>
      <text x="396" y="60" font-size="11.5" font-weight="700" fill="#111315">Chế độ đếm giờ mặc định</text>
      <text x="396" y="76" font-size="9.5" fill="#66655f">Cấu hình → Chung &amp; Telegram</text>

      <rect x="396" y="90" width="278" height="44" rx="9" fill="#eef4ff" stroke="#c7d7fe"/>
      <text x="406" y="108" font-size="9.5" font-weight="600" fill="#1d4ed8">◉ Đếm 12 giờ liên tục — bất kể ngày đêm</text>
      <text x="406" y="124" font-size="9" fill="#3b5bd6">Đơn gửi 20h thứ 6 vẫn bị tính giờ qua cuối tuần.</text>

      <rect x="396" y="142" width="278" height="44" rx="9" fill="#e6f5f3" stroke="#a7ded6"/>
      <text x="406" y="160" font-size="9.5" font-weight="600" fill="#0f766e">○ Chỉ tính thứ 2 → thứ 6, trong giờ hành chính</text>
      <text x="406" y="176" font-size="9" fill="#0f766e">Bỏ qua cuối tuần và ngày lễ; cần khai giờ bắt đầu / kết thúc.</text>

      <rect x="396" y="196" width="134" height="26" rx="8" fill="#f6f6f4" stroke="#d9d5cc"/>
      <text x="463" y="213" font-size="9.5" fill="#3f3e3a" text-anchor="middle">Giờ bắt đầu</text>
      <rect x="540" y="196" width="134" height="26" rx="8" fill="#f6f6f4" stroke="#d9d5cc"/>
      <text x="607" y="213" font-size="9.5" fill="#3f3e3a" text-anchor="middle">Giờ kết thúc</text>

      <text x="396" y="244" font-size="9.5" fill="#66655f">Quy tắc này là MẶC ĐỊNH toàn hệ thống; từng bước duyệt</text>
      <text x="396" y="257" font-size="9.5" fill="#66655f">có thể ghi đè lại trong nhóm "Xử lý quá hạn".</text>
    </g>
  </g>
</svg>
